  <rect
    x="16"
    y="16"
    width="32"
    height="32"
    rx="10"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
  />

  <circle
    cx="32"
    cy="32"
    r="8"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
  />

  <circle
    cx="43"
    cy="21"
    r="2.5"
    fill="#FFFFFF"
  />
</svg>