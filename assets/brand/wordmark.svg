<?xml version="1.0" encoding="UTF-8"?>

<!-- ======================================================
     SalimGPT
     File: assets/brand/wordmark.svg
     Purpose: Primary Horizontal Brand Wordmark
     Background: Transparent
     ====================================================== -->

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 250"
  role="img"
  aria-labelledby="salimgptWordmarkTitle salimgptWordmarkDesc"
>

  <title id="salimgptWordmarkTitle">
    SalimGPT Wordmark
  </title>

  <desc id="salimgptWordmarkDesc">
    SalimGPT-এর কালো, সাদা, লাল ও নীল accent-সহ horizontal brand wordmark।
  </desc>


  <!-- ====================================================
       DEFINITIONS
       ==================================================== -->

  <defs>

    <linearGradient
      id="markBg"
      x1="35"
      y1="25"
      x2="225"
      y2="225"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#18191d"
      />

      <stop
        offset="0.55"
        stop-color="#101114"
      />

      <stop
        offset="1"
        stop-color="#08090b"
      />
    </linearGradient>


    <linearGradient
      id="brandRed"
      x1="38"
      y1="34"
      x2="220"
      y2="215"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#ff3767"
      />

      <stop
        offset="0.5"
        stop-color="#f71950"
      />

      <stop
        offset="1"
        stop-color="#d80f41"
      />
    </linearGradient>


    <linearGradient
      id="markWhite"
      x1="70"
      y1="60"
      x2="150"
      y2="190"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#ffffff"
      />

      <stop
        offset="1"
        stop-color="#e6e8ec"
      />
    </linearGradient>


    <filter
      id="markShadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity="0.22"
      />
    </filter>

  </defs>


  <!-- ====================================================
       ICON / MONOGRAM
       ==================================================== -->

  <g
    id="brand-mark"
    transform="translate(18 17)"
  >

    <rect
      x="0"
      y="0"
      width="216"
      height="216"
      rx="51"
      fill="url(#markBg)"
      filter="url(#markShadow)"
    />


    <rect
      x="8"
      y="8"
      width="200"
      height="200"
      rx="44"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.09"
      stroke-width="1.5"
    />


    <!-- Red identity bar -->

    <rect
      x="22"
      y="20"
      width="55"
      height="17"
      rx="8.5"
      fill="url(#brandRed)"
    />


    <!-- Blue micro accent -->

    <circle
      cx="185"
      cy="29"
      r="4.5"
      fill="#087cf0"
    />


    <!-- S -->

    <path
      d="
        M118 66
        C108 57 96 53 83 53
        C63 53 48 63 48 79
        C48 94 60 102 81 106
        L94 109
        C108 112 114 116 114 123
        C114 131 106 136 93 136
        C78 136 66 130 57 120
      "
      fill="none"
      stroke="url(#markWhite)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />


    <path
      d="
        M57 120
        C66 135 79 143 95 143
        C116 143 131 134 131 118
      "
      fill="none"
      stroke="url(#markWhite)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />


    <!-- G -->

    <path
      d="
        M159 77
        C151 62 139 53 123 53
        C99 53 82 72 82 99
        C82 126 100 145 125 145
        C141 145 154 139 162 128
      "
      fill="none"
      stroke="url(#brandRed)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />


    <path
      d="
        M130 108
        H165
        V135
      "
      fill="none"
      stroke="url(#brandRed)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />


    <!-- Bottom identity line -->

    <rect
      x="53"
      y="174"
      width="69"
      height="4"
      rx="2"
      fill="#ffffff"
      opacity="0.9"
    />

    <rect
      x="126"
      y="174"
      width="29"
      height="4"
      rx="2"
      fill="url(#brandRed)"
    />

    <rect
      x="159"
      y="174"
      width="12"
      height="4"
      rx="2"
      fill="#087cf0"
    />

  </g>


  <!-- ====================================================
       WORDMARK
       ==================================================== -->

  <g
    id="wordmark"
    transform="translate(275 0)"
  >

    <!-- SALIM -->

    <text
      x="0"
      y="128"
      fill="#101114"
      font-family="Arial, Helvetica, sans-serif"
      font-size="103"
      font-weight="900"
      letter-spacing="-6"
    >
      Salim
    </text>


    <!-- GPT -->

    <text
      x="264"
      y="128"
      fill="#f71950"
      font-family="Arial, Helvetica, sans-serif"
      font-size="103"
      font-weight="900"
      letter-spacing="-6"
    >
      GPT
    </text>


    <!-- ==================================================
         BRAND SIGNATURE
         ================================================== -->

    <g transform="translate(3 152)">

      <rect
        x="0"
        y="0"
        width="96"
        height="5"
        rx="2.5"
        fill="#101114"
      />

      <rect
        x="103"
        y="0"
        width="46"
        height="5"
        rx="2.5"
        fill="#f71950"
      />

      <rect
        x="156"
        y="0"
        width="17"
        height="5"
        rx="2.5"
        fill="#087cf0"
      />

    </g>


    <!-- ==================================================
         TAGLINE
         ================================================== -->

    <text
      x="2"
      y="191"
      fill="#6f747d"
      font-family="Arial, Helvetica, sans-serif"
      font-size="22"
      font-weight="700"
      letter-spacing="2.6"
    >
      RESEARCH-BASED DOCUMENTARY MEDIA
    </text>


    <!-- ==================================================
         MICRO IDENTITY DETAIL
         ================================================== -->

    <g
      transform="translate(518 49)"
      opacity="0.9"
    >

      <circle
        cx="0"
        cy="0"
        r="5"
        fill="#f71950"
      />

      <circle
        cx="18"
        cy="0"
        r="5"
        fill="#087cf0"
      />

    </g>

  </g>

</svg>